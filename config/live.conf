# pk's OS build config (it gets shell-sourced). Change names/labels/defaults here.
# shellcheck shell=sh

OS_NAME="pk's OS"
OS_VERSION=1.1
OS_ID=pkos
ISO_LABEL=PKOS
HOSTNAME=pk

# default user of the live session (autologin is on in live; password: pk)
LIVE_USER=root
LIVE_PASS=pk

# squashfs compression: auto | zstd | xz | lz4 | gzip
SQUASH_COMP=auto

# which kernel modules go into the initramfs (the build computes the dependency order itself)
INIT_MODULES=init

# kernel image + its modules dir. empty = newest /boot/vmlinuz-* on the host
PK_KERNEL=${PK_KERNEL:-}
PK_MODULES=${PK_MODULES:-}

# grub default live boot args
# consoleblank=0 + cursor: "black screen after GRUB" class gets its first remedy
# (VT blanking/DPMS also goes off via our S08display hook; here at kernel level)
KERNEL_CMDLINE=${KERNEL_CMDLINE:-"quiet loglevel=3 consoleblank=0 vt.global_cursor_default=1"}

export OS_NAME OS_VERSION OS_ID ISO_LABEL HOSTNAME LIVE_USER LIVE_PASS
export SQUASH_COMP INIT_MODULES KERNEL_CMDLINE
