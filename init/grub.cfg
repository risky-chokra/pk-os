# pk's OS ISO - grub-mkrescue config
# NOTE: this is a template; mk-iso substitutes @ARGS@/@VER@/@LABEL@ with real values.
set timeout=5
set default=0
set color_normal=light-gray/black
set color_highlight=white/dark-gray

# for headless machines / QEMU without a display: show the GRUB menu on serial too
# (--append keeps the VGA output). No effect when there is no serial port.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input  --append serial
terminal_output --append serial

menuentry "pk's OS @VER@ (live)" --hotkey l {
    linux /boot/pk-kernel @ARGS@
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: toram - copy image to RAM)" --hotkey t {
    linux /boot/pk-kernel @ARGS@ toram
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: persistent - save changes on the stick)" --hotkey p {
    linux /boot/pk-kernel @ARGS@ persistent
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: network + SSH on)" --hotkey n {
    linux /boot/pk-kernel @ARGS@ pk_net=dhcp pk_ssh=on
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: desktop + apps GUI)" --hotkey g {
    linux /boot/pk-kernel @ARGS@ pk_desktop=1 pk_tune=desktop pk_net=dhcp
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: pendrive hardware self-test)" --hotkey k {
    linux /boot/pk-kernel @ARGS@ pk_check=1 pk_tune=report pk_net=dhcp
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (install to internal disk)" --hotkey i {
    linux /boot/pk-kernel @ARGS@ pk_install=ask
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (install: headless, auto disk, then reboot)" --hotkey a {
    linux /boot/pk-kernel @ARGS@ pk_install=auto pk_silent pk_halt
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (debug: kernel log + init shell)" --hotkey d {
    linux /boot/pk-kernel loglevel=7 pk_debug
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: safe graphics - nomodeset)" --hotkey v {
    linux /boot/pk-kernel @ARGS@ nomodeset
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live: safe graphics + serial 115200)" --hotkey b {
    linux /boot/pk-kernel @ARGS@ nomodeset console=tty0 console=ttyS0,115200n8
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (live, serial console 115200)" --hotkey c {
    linux /boot/pk-kernel @ARGS@ console=tty0 console=ttyS0,115200n8
    initrd /boot/pk-initrd
}
menuentry "pk's OS @VER@ (single user)" --hotkey s {
    linux /boot/pk-kernel @ARGS@ single
    initrd /boot/pk-initrd
}
