# pk's OS :: mdev device nodes + permissions (busybox mdev.conf)
# Do kaam: (a) /dev nodes banao sahi group/mode ke saath - audio/input/GPU ke nodes
# ke bina weston/benchmark/app chal hi nahi sakte; (b) har add par hotplug.sh ->
# `modprobe $MODALIAS`, taaki USB device ghusate hi driver load ho jaaye.
# NOTE: busybox mdev PEHLA matching rule use karta hai, isliye har line par
# @/etc/mdev/hotplug.sh copy kiya hai (warna driver loading chhoot jaati).
console           0:5     600   @/etc/mdev/hotplug.sh
tty[0-9]*         0:5     620   @/etc/mdev/hotplug.sh
ttyS[0-9]*        0:5     660   @/etc/mdev/hotplug.sh
ttyUSB[0-9]*      0:20    660   @/etc/mdev/hotplug.sh
ttyACM[0-9]*      0:20    660   @/etc/mdev/hotplug.sh
fb[0-9]*          0:44    660   @/etc/mdev/hotplug.sh
drm/card[0-9]*    0:44    660   @/etc/mdev/hotplug.sh
drm/renderD[0-9]* 0:160   660   @/etc/mdev/hotplug.sh
input/event[0-9]* 0:108   660   @/etc/mdev/hotplug.sh
input/mouse[0-9]* 0:108   660   @/etc/mdev/hotplug.sh
input/js[0-9]*    0:108   660   @/etc/mdev/hotplug.sh
input/touchscreen.* 0:108 660   @/etc/mdev/hotplug.sh
snd/.*            0:63    660   @/etc/mdev/hotplug.sh
snd/seq           0:63    660   @/etc/mdev/hotplug.sh
snd/timer         0:63    0666  @/etc/mdev/hotplug.sh
usb/lp[0-9]*      0:7     660   @/etc/mdev/hotplug.sh
usblp[0-9]*       0:7     660   @/etc/mdev/hotplug.sh
htun[0-9]*|tun[0-9]* 0:0  660   @/etc/mdev/hotplug.sh
loop[0-9]*        0:6     660   @/etc/mdev/hotplug.sh
ram[0-9]*         0:6     660   @/etc/mdev/hotplug.sh
hd[a-z][0-9]*     0:6     660   @/etc/mdev/hotplug.sh
sd[a-z][0-9]*     0:6     660   @/etc/mdev/hotplug.sh
nvme[0-9]*n[0-9]* 0:6     660   @/etc/mdev/hotplug.sh
sr[0-9]*          0:24    660   @/etc/mdev/hotplug.sh
i2c-[0-9]*        0:0     660   @/etc/mdev/hotplug.sh
videodev[0-9]*    0:44    660   @/etc/mdev/hotplug.sh
media[0-9]*       0:44    660   @/etc/mdev/hotplug.sh
dm-[0-9]*         0:6     660   @/etc/mdev/hotplug.sh
# baaqi sab (root-only mat rakho - live system single-user hai; par block devices upar
# hi handle hain, isliye yahan sirf chhote-mote nodes aayenge)
.*                0:0     666   @/etc/mdev/hotplug.sh
